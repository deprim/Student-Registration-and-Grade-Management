{% if page_obj.paginator.num_pages > 1 %}
  <nav class="pagination-bar no-print" aria-label="Pagination">
    <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} records</span>
    <div>
      {% if page_obj.has_previous %}
        <a class="btn btn-sm btn-light"
           href="{% querystring page=page_obj.previous_page_number %}">← Previous</a>
      {% endif %}
      {% if page_obj.has_next %}
        <a class="btn btn-sm btn-light"
           href="{% querystring page=page_obj.next_page_number %}">Next →</a>
      {% endif %}
    </div>
  </nav>
{% endif %}
